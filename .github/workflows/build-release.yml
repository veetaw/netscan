name: Build packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Configure optional Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android_signing.py
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Package APK and signing information
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/netscan-android.apk
          cp LICENSE dist/
          cp "$RUNNER_TEMP/netscan-signing.txt" dist/SIGNING.txt
          cd dist
          sha256sum netscan-android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netscan-android
          path: dist/
          if-no-files-found: error
  windows:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build installer
        shell: pwsh
        run: |
          $version = ((Select-String '^version:' pubspec.yaml).Line -split '\s+')[1].Split('+')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/netscan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE dist/
          'Unsigned Windows installer. No publisher certificate has been configured.' | Set-Content dist/SIGNING.txt
          Get-ChildItem dist/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netscan-windows-x64
          path: dist/
          if-no-files-found: error
  macos:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Build disk image
        run: |
          mkdir -p dist build/dmg
          cp -R build/macos/Build/Products/Release/netscan.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Netscan -srcfolder build/dmg -ov -format UDZO dist/netscan-macos.dmg
          cp LICENSE dist/
          printf '%s\n' 'Ad-hoc signed development build. Not signed with Developer ID or notarized by Apple.' > dist/SIGNING.txt
          cd dist
          shasum -a 256 netscan-macos.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: netscan-macos
          path: dist/
          if-no-files-found: error
